name: CI

# One workflow, because `needs` cannot reach across workflow files. The images
# used to be built by prod.yml and dev.yml on the same push as tests.yml and
# therefore shipped whatever the tests said.
on:
  push:
    branches:
      - master
      - main
      - dev
  pull_request:
    branches:
      - master
      - main
      - dev
  workflow_dispatch:

jobs:
  test:
    name: Build and test
    # mongo:8.0 refuses to start on the Ubuntu 26.04 runner kernel (SERVER-136848)
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: '1.26'

      - name: Build
        run: go build -v ./...

      - name: Test
        timeout-minutes: 240
        uses: nick-fields/retry@v2
        with:
          max_attempts: 3
          retry_on: error
          timeout_minutes: 240
          command: go test -short -v -timeout 99999s ./...

  image:
    name: PROD Docker Image
    needs: [test]
    # prod.yml also ran on a push of a version tag. That trigger is gone: this
    # job creates the tag itself, so keeping it would run the tests a second
    # time on the same tree for every release. A build from a tag is still a
    # workflow_dispatch on that ref. The ref decides, not the event, so a
    # dispatch on dev does not release a prod image.
    if: >-
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Login to DockerHub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1
      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.1
        with:
          release_branches: ".*"
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            smartenergyplatform/connectionlog-worker:prod
            ghcr.io/senergy-platform/connectionlog-worker:prod
            smartenergyplatform/connectionlog-worker:${{ steps.tag_version.outputs.new_tag }}
            ghcr.io/senergy-platform/connectionlog-worker:${{ steps.tag_version.outputs.new_tag }}
            smartenergyplatform/connectionlog-worker:latest
            ghcr.io/senergy-platform/connectionlog-worker:latest

  dev-image:
    name: DEV Docker Image
    needs: [test]
    if: >-
      github.ref == 'refs/heads/dev' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Login to DockerHub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1
      - name: Build and push
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            smartenergyplatform/connectionlog-worker:dev
            ghcr.io/senergy-platform/connectionlog-worker:dev
