name: CI

# One workflow, because `needs` cannot reach across workflow files. The images
# used to be built by prod.yml and dev.yml on the same push as tests.yml and
# therefore shipped whatever the tests said.
on:
  push:
    branches:
      - master
      - main
      - dev
  pull_request:
    branches:
      - master
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    # mongo:8.0 refuses to start on the Ubuntu 26.04 runner kernel (SERVER-136848)
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: '1.26'

      - name: Build
        run: go build -v ./...

      - name: Test
        timeout-minutes: 240
        uses: nick-fields/retry@v2
        with:
          max_attempts: 3
          retry_on: error
          timeout_minutes: 240
          command: go test -short -v -timeout 99999s ./...

  version:
    name: PROD version
    needs: [test]
    # prod.yml also ran on a push of a version tag. That trigger is gone: this
    # job creates the tag itself, so keeping it would run the tests a second
    # time on the same tree for every release. A build from a tag is still a
    # workflow_dispatch on that ref. The ref decides, not the event, so a
    # dispatch on dev does not release a prod image.
    if: >-
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag_version.outputs.new_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.1
        with:
          release_branches: ".*"
          github_token: ${{ secrets.GITHUB_TOKEN }}

  # Builds each platform on a native runner of its own, arm64 without QEMU, and merges
  # both into one manifest under every tag below.
  image:
    name: PROD Docker Image
    needs: [version]
    if: >-
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      id-token: write # signs the provenance attestation
    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      # The build context is the Git repository at the pushed commit, which leaves out
      # .git unless asked to keep it. The Dockerfile reads the commit from it.
      build-args: |
        BUILDKIT_CONTEXT_KEEP_GIT_DIR=1
      meta-images: |
        smartenergyplatform/connectionlog-worker
        ghcr.io/senergy-platform/connectionlog-worker
      meta-tags: |
        type=raw,value=prod
        type=raw,value=${{ needs.version.outputs.tag }}
        type=raw,value=latest
      meta-flavor: |
        latest=false
    secrets:
      registry-auths: |
        - registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        - registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT }}

  # Builds each platform on a native runner of its own, arm64 without QEMU, and merges
  # both into one manifest under the tag below.
  dev-image:
    name: DEV Docker Image
    needs: [test]
    if: >-
      github.ref == 'refs/heads/dev' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      id-token: write # signs the provenance attestation
    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      # The build context is the Git repository at the pushed commit, which leaves out
      # .git unless asked to keep it. The Dockerfile reads the commit from it.
      build-args: |
        BUILDKIT_CONTEXT_KEEP_GIT_DIR=1
      meta-images: |
        smartenergyplatform/connectionlog-worker
        ghcr.io/senergy-platform/connectionlog-worker
      meta-tags: |
        type=raw,value=dev
      meta-flavor: |
        latest=false
    secrets:
      registry-auths: |
        - registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        - registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT }}
